worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Não expõe a versão do Nginx nos headers/erros
    server_tokens off;

    # ---- zona de rate limiting: no máx. 10 requisições/seg por IP,
    # com uma folga (burst) de 20 antes de começar a bloquear ----
    limit_req_zone $binary_remote_addr zone=geral:10m rate=10r/s;
    limit_req_status 429;

    # ---- redireciona todo HTTP pra HTTPS ----
    server {
        listen 80;
        server_name 192.168.0.150;   # <<< AJUSTE >>> IP ou domínio do seu servidor
        return 301 https://$host$request_uri;
    }

    # ---- servidor principal, HTTPS ----
    server {
        listen 443 ssl;
        http2 on;
        server_name 192.168.0.150;   # <<< AJUSTE >>>

        # Os mesmos certificados que o Flask usava direto antes
        ssl_certificate      "L:/xingia/192.168.0.150.pem";       # <<< AJUSTE >>>
        ssl_certificate_key  "L:/xingia/192.168.0.150-key.pem";   # <<< AJUSTE >>>
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Permite os uploads grandes que o app já suporta (5GB)
        client_max_body_size 5120M;
        client_body_timeout 300s;

        # ---- Headers de segurança ----
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Bloqueia acesso a arquivos escondidos/sensíveis (.env, .git, etc.)
        location ~ /\. {
            deny all;
            return 404;
        }
        location ~* \.(env|db|sqlite3?|log|bak)$ {
            deny all;
            return 404;
        }

        # ---- (opcional, mas recomendado) serve arquivos estáticos
        # diretamente pelo Nginx em vez de passar pelo Waitress/Flask.
        # location /static/ {
        #     alias L:/xingia/static/;          # <<< AJUSTE >>>
        #     expires 7d;
        #     access_log off;
        # }

        # Login e cadastro merecem um rate limit mais apertado (dificulta
        # força bruta de senha). Tem que vir ANTES do location / genérico.
        location ~ ^/(login|cadastro)$ {
            limit_req zone=geral burst=5 nodelay;
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---- Tudo mais vai pro Waitress (Flask) ----
        location / {
            limit_req zone=geral burst=20 nodelay;

            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;

            # Repassa informação real do cliente pro Flask (usado pelo ProxyFix)
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            # Uploads grandes / streaming de vídeo precisam de timeouts folgados
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_request_buffering off;
        }
    }
}