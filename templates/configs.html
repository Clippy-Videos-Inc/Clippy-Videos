<!DOCTYPE html>
<html lang="{{ lang_atual }}">
<head>
    <title>{{ t.configs.titulo_pagina }}</title>
    <style>
        body { background: {{ user_settings.cor_fundo }}; font-family: sans-serif; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 10px; max-width: 400px; margin: auto; }
    </style>
</head>
<body>
    <div class="card">
        <h2>{{ t.configs.titulo }}</h2>
		{% if user_settings.idade | int <= 11 %}
<div class="alert alert-warning">
    <strong>{{ t.configs.modo_infantil_titulo }}</strong><br>
    {{ t.configs.modo_infantil_texto }}
    <br><a href="/supervisao-confirmar">{{ t.configs.modo_infantil_link }}</a>
</div>
{% endif %}
        <form method="POST">
            <label>{{ t.configs.cor_fundo }}</label><br>
            <input type="color" name="cor_fundo" value="{{ user_settings.cor_fundo }}"><br><br>

            <label>{{ t.configs.sua_idade }}</label><br>
            <select name="idade">
                <option value="2" {% if user_settings.idade == '2' %}selected{% endif %}>2 {{ t.configs.anos }}</option>
                <option value="3" {% if user_settings.idade == '3' %}selected{% endif %}>3 {{ t.configs.anos }}</option>
                <option value="4" {% if user_settings.idade == '4' %}selected{% endif %}>4 {{ t.configs.anos }}</option>
				<option value="5" {% if user_settings.idade == '5' %}selected{% endif %}>5 {{ t.configs.anos }}</option>
				<option value="6" {% if user_settings.idade == '6' %}selected{% endif %}>6 {{ t.configs.anos }}</option>
				<option value="7" {% if user_settings.idade == '7' %}selected{% endif %}>7 {{ t.configs.anos }}</option>
				<option value="8" {% if user_settings.idade == '8' %}selected{% endif %}>8 {{ t.configs.anos }}</option>
				<option value="9" {% if user_settings.idade == '9' %}selected{% endif %}>9 {{ t.configs.anos }}</option>
				<option value="10" {% if user_settings.idade == '10' %}selected{% endif %}>10 {{ t.configs.anos }}</option>
				<option value="11" {% if user_settings.idade == '11' %}selected{% endif %}>11 {{ t.configs.anos }}</option>
				<option value="12" {% if user_settings.idade == '12' %}selected{% endif %}>12 {{ t.configs.anos }}</option>
				<option value="13" {% if user_settings.idade == '13' %}selected{% endif %}>13 {{ t.configs.anos }}</option>
				<option value="14" {% if user_settings.idade == '14' %}selected{% endif %}>14 {{ t.configs.anos }}</option>
				<option value="15" {% if user_settings.idade == '15' %}selected{% endif %}>15 {{ t.configs.anos }}</option>
				<option value="16" {% if user_settings.idade == '16' %}selected{% endif %}>16 {{ t.configs.anos }}</option>
				<option value="17" {% if user_settings.idade == '17' %}selected{% endif %}>17 {{ t.configs.anos }}</option>
				<option value="18" {% if user_settings.idade == '18' %}selected{% endif %}>18 {{ t.configs.anos }}</option>
				<option value="19" {% if user_settings.idade == '19' %}selected{% endif %}>19 {{ t.configs.anos }}</option>
				<option value="20" {% if user_settings.idade == '20' %}selected{% endif %}>{{ t.configs.mais_de_20_anos }}</option>
            </select><br><br>

            <label>{{ t.configs.idioma }}</label><br>
            <select name="idioma">
                {% for codigo, nome in idiomas_disponiveis.items() %}
                <option value="{{ codigo }}" {% if lang_atual == codigo %}selected{% endif %}>{{ nome }}</option>
                {% endfor %}
            </select><br><br>

            <button type="submit">{{ t.configs.salvar }}</button>
            <a href="{{ url_for('index') }}">{{ t.configs.voltar }}</a>
        </form>
    </div>
</body>
</html>
