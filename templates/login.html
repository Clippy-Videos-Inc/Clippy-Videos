<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Clippy Videos - Login & {{ t.login.cadastro }}</title>

    <link rel="icon" href="{{ static_url }}/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');

        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #e7ebf0;
            overflow: hidden;
        }

        .bg-circle {
            position: fixed;
            border-radius: 50%;
            background: #e7ebf0;
            box-shadow:
                15px 15px 30px rgba(163, 177, 198, .55),
                -15px -15px 30px rgba(255, 255, 255, .9);
            z-index: -5;
            animation: floating 6s ease-in-out infinite;
        }

        .bg1 {
            width: 190px;
            height: 190px;
            top: 7%;
            left: 7%;
        }

        .bg2 {
            width: 130px;
            height: 130px;
            right: 8%;
            bottom: 8%;
            animation-delay: 1.5s;
        }

        .bg3 {
            width: 55px;
            height: 55px;
            right: 20%;
            top: 20px;
            animation-delay: 3s;
        }

        @keyframes floating {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-18px);
            }
        }

        .auth-wrapper {
            width: 400px;
            max-width: 92%;
            perspective: 1600px;
        }

        .auth-card {
            position: relative;
            width: 100%;
            min-height: 610px;
            transform-style: preserve-3d;
            transition: transform 1s cubic-bezier(.68, -0.55, .27, 1.55);
        }

        .auth-card.flipped {
            transform: rotateY(180deg);
        }

        .form-panel {
            position: absolute;
            inset: 0;
            padding: 40px 38px;
            border-radius: 35px;
            background: #e7ebf0;
            box-shadow:
                20px 20px 40px rgba(163, 177, 198, .65),
                -20px -20px 40px rgba(255, 255, 255, .95);
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        .signup-panel {
            transform: rotateY(180deg);
        }

        .logo {
            width: 86px;
            height: 86px;
            margin: 0 auto 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            font-size: 30px;
            color: #087cff;
            background: #e7ebf0;
            box-shadow:
                9px 9px 18px rgba(163, 177, 198, .65),
                -9px -9px 18px rgba(255, 255, 255, .95);
            transition: .4s ease;
        }

        .logo:hover {
            transform: translateY(-5px) rotate(8deg);
        }

        h2 {
            text-align: center;
            font-size: 27px;
            color: #303943;
            margin-bottom: 25px;
        }

        .auth-form {
            width: 100%;
        }

        .input-group {
            position: relative;
            width: 100%;
            margin-bottom: 19px;
        }

        .input-wrapper {
            position: relative;
            width: 100%;
            height: 58px;
            margin-bottom: 19px;
        }

        .electric-border {
            position: absolute;
            inset: -2px;
            border-radius: 19px;
            overflow: hidden;
            pointer-events: none;
            opacity: 0;
            transition: opacity .2s ease;
            z-index: 1;
        }

        .electric-border::before {
            content: "";
            position: absolute;
            width: 170%;
            height: 170%;
            left: -35%;
            top: -35%;
            background: conic-gradient(
                from 0deg,
                transparent 0deg,
                transparent 30deg,
                #00eaff 45deg,
                #00aaff 65deg,
                #006cff 80deg,
                transparent 105deg,
                transparent 360deg
            );
            animation: electricRotate 1.1s linear infinite;
        }

        .electric-border::after {
            content: "";
            position: absolute;
            inset: 2px;
            border-radius: 17px;
            background: #e7ebf0;
        }

        .electric-glow {
            position: absolute;
            inset: -4px;
            border-radius: 21px;
            pointer-events: none;
            opacity: 0;
            filter: blur(7px);
            background: conic-gradient(
                from 0deg,
                transparent 0deg,
                transparent 30deg,
                #00eaff 45deg,
                #00aaff 65deg,
                #006cff 80deg,
                transparent 105deg,
                transparent 360deg
            );
        }

        .input-wrapper:focus-within .electric-border {
            opacity: 1;
        }

        .input-wrapper:focus-within .electric-glow {
            opacity: .55;
            animation: electricRotate 1.1s linear infinite;
        }

        @keyframes electricRotate {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .input-wrapper input {
            position: absolute;
            inset: 2px;
            width: calc(100% - 4px);
            height: 54px;
            border: none;
            outline: none;
            border-radius: 17px;
            background: #e7ebf0;
            color: #303943;
            font-size: 15px;
            padding: 0 48px 0 18px;
            z-index: 20;
            box-shadow:
                inset 6px 6px 12px rgba(163, 177, 198, .55),
                inset -6px -6px 12px rgba(255, 255, 255, .95);
            transition: box-shadow .25s ease;
        }

        .input-wrapper input:focus {
            box-shadow:
                inset 3px 3px 7px rgba(163, 177, 198, .55),
                inset -3px -3px 7px rgba(255, 255, 255, .95);
        }

        .input-wrapper label {
            position: absolute;
            left: 18px;
            top: 20px;
            z-index: 30;
            color: #89929c;
            font-size: 13px;
            pointer-events: none;
            transition: all .25s ease;
        }

        .input-wrapper input:focus + label,
        .input-wrapper input:not(:placeholder-shown) + label {
            top: -8px;
            left: 13px;
            padding: 2px 8px;
            border-radius: 7px;
            background: #e7ebf0;
            color: #0072ff;
            font-size: 10px;
            line-height: 14px;
            white-space: nowrap;
        }

        .password-toggle {
            position: absolute;
            right: 14px;
            top: 15px;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            background: transparent;
            color: #7d8790;
            cursor: pointer;
            z-index: 40;
            font-size: 18px;
        }

        .password-toggle:hover {
            color: #0072ff;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 5px 0 20px;
            color: #69737d;
            font-size: 13px;
            cursor: pointer;
        }

        .remember input {
            width: 16px;
            height: 16px;
            accent-color: #087cff;
            cursor: pointer;
        }

        .main-btn {
            width: 100%;
            height: 52px;
            border: none;
            border-radius: 17px;
            background: #087cff;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow:
                7px 7px 14px rgba(163, 177, 198, .6),
                -7px -7px 14px rgba(255, 255, 255, .9);
            transition: .25s ease;
        }

        .main-btn:hover {
            background: #006fe6;
            transform: translateY(-2px);
        }

        .main-btn:active {
            transform: translateY(1px);
            box-shadow:
                inset 4px 4px 8px rgba(0, 70, 160, .25),
                inset -4px -4px 8px rgba(255, 255, 255, .2);
        }

        .switch-form {
            margin-top: 22px;
            text-align: center;
            color: #69737d;
            font-size: 13px;
        }

        .switch-form button {
            border: none;
            background: transparent;
            color: #0072ff;
            font-weight: 600;
            cursor: pointer;
            font-size: inherit;
        }

        .switch-form button:hover {
            text-decoration: underline;
        }

        .error {
            color: #d32f2f;
            margin-bottom: 10px;
            font-size: .9em;
            text-align: center;
        }

        @media (max-width: 480px) {
            .auth-wrapper {
                max-width: 94%;
            }

            .form-panel {
                padding: 32px 25px;
                border-radius: 28px;
            }

            .auth-card {
                min-height: 620px;
            }
        }
    </style>
</head>

<body>

    <div class="bg-circle bg1"></div>
    <div class="bg-circle bg2"></div>
    <div class="bg-circle bg3"></div>

    <div class="auth-wrapper">
        <div class="auth-card" id="authcard">

            <!-- LOGIN -->
            <div class="form-panel login-panel">

                <div class="logo">
                    <i class="fa-solid fa-lock"></i>
                </div>

                <h2>{{ t.login.entrar }}</h2>

                <form class="auth-form" action="/login" method="POST">

                    <div class="input-wrapper">
                        <div class="electric-glow"></div>
                        <div class="electric-border"></div>

                        <input
                            type="text"
                            id="login-username"
                            name="username"
                            placeholder=" "
                            autocomplete="username"
                            required
                            autofocus
                        >

                        <label for="login-username">
                            Usuário
                        </label>
                    </div>

                    <div class="input-wrapper">
                        <div class="electric-glow"></div>
                        <div class="electric-border"></div>

                        <input
                            type="password"
                            id="login-password"
                            name="password"
                            placeholder=" "
                            autocomplete="current-password"
                            required
                        >

                        <label for="login-password">
                            Senha
                        </label>

                        <button
                            type="button"
                            class="password-toggle"
                            onclick="togglePassword('login-password', this)"
                            aria-label="Mostrar senha"
                        >
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>

                    <label class="remember">
                        <input type="checkbox" name="lembrar" value="1">
                        {{ t.login.lembrar }}
                    </label>

                    <button type="submit" class="main-btn">
                        {{ t.login.entrar }}
                    </button>

                </form>

                <div class="switch-form">
                    Ainda não possui uma conta?
                    <button type="button" onclick="flipCard()">
                        {{ t.login.cadastro }}
                    </button>
                </div>

            </div>

            <!-- CADASTRO -->
            <div class="form-panel signup-panel">

                <div class="logo">
                    <i class="fa-solid fa-user"></i>
                </div>

                <h2>{{ t.login.cadastro }}</h2>

                <form class="auth-form" action="/cadastro" method="POST">

                    <div class="input-wrapper">
                        <div class="electric-glow"></div>
                        <div class="electric-border"></div>

                        <input
                            type="text"
                            id="register-name"
                            name="nome"
                            placeholder=" "
                            autocomplete="name"
                            required
                        >

                        <label for="register-name">
                            Nome completo
                        </label>
                    </div>

                    <div class="input-wrapper">
                        <div class="electric-glow"></div>
                        <div class="electric-border"></div>

                        <input
                            type="email"
                            id="register-email"
                            name="email"
                            placeholder=" "
                            autocomplete="email"
                            required
                        >

                        <label for="register-email">
                            Email
                        </label>
                    </div>

                    <div class="input-wrapper">
                        <div class="electric-glow"></div>
                        <div class="electric-border"></div>

                        <input
                            type="text"
                            id="register-username"
                            name="username"
                            placeholder=" "
                            autocomplete="username"
                            required
                        >

                        <label for="register-username">
                            Usuário
                        </label>
                    </div>

                    <div class="input-wrapper">
                        <div class="electric-glow"></div>
                        <div class="electric-border"></div>

                        <input
                            type="password"
                            id="register-password"
                            name="password"
                            placeholder=" "
                            autocomplete="new-password"
                            required
                        >

                        <label for="register-password">
                            Senha
                        </label>

                        <button
                            type="button"
                            class="password-toggle"
                            onclick="togglePassword('register-password', this)"
                            aria-label="Mostrar senha"
                        >
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>

                    <button type="submit" class="main-btn">
                        {{ t.login.cadastrar }}
                    </button>

                </form>

                <div class="switch-form">
                    Já possui uma conta?
                    <button type="button" onclick="flipCard()">
                        {{ t.login.entrar }}
                    </button>
                </div>

            </div>

        </div>
    </div>

    <script>
        const authCard = document.getElementById("authcard");

        function flipCard() {
            authCard.classList.toggle("flipped");
        }

        function togglePassword(inputId, button) {
            const input = document.getElementById(inputId);
            const icon = button.querySelector("i");

            if (input.type === "password") {
                input.type = "text";
                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash");
                button.setAttribute("aria-label", "Ocultar senha");
            } else {
                input.type = "password";
                icon.classList.remove("fa-eye-slash");
                icon.classList.add("fa-eye");
                button.setAttribute("aria-label", "Mostrar senha");
            }
        }
    </script>

</body>
</html>
