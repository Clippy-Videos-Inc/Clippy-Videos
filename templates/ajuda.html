<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>{{ t.ajuda.titulo }} - Clippy Videos</title>
    <script>
        function openTab(evt, tabName) {
            var i, tabcontent, tablinks;
            tabcontent = document.getElementsByClassName("tabcontent");
            for (i = 0; i < tabcontent.length; i++) {
                tabcontent[i].style.display = "none";
            }
            tablinks = document.getElementsByClassName("tablinks");
            for (i = 0; i < tablinks.length; i++) {
                tablinks[i].className = tablinks[i].className.replace(" active", "");
            }
            document.getElementById(tabName).style.display = "block";
            evt.currentTarget.className += " active";
        }
    </script>
    <style>
        body { font-family: Arial, sans-serif; }
        .tab { overflow: hidden; border-bottom: 1px solid #ccc; }
        .tab button { background-color: inherit; border: none; outline: none; cursor: pointer; padding: 14px 16px; transition: 0.3s; }
        .tab button:hover { background-color: #ddd; }
        .tab button.active { background-color: #ccc; }
        .tabcontent { display: none; padding: 20px; border: 1px solid #ccc; border-top: none; }
    </style>
</head>
<body>

<h1>{{ t.ajuda.titulo }} - Clippy Videos</h1>

<div class="tab">
  <button class="tablinks" onclick="openTab(event, 'Introducao')">{{ t.ajuda.introducao }}</button>
  <button class="tablinks" onclick="openTab(event, 'Uso')">{{ t.ajuda.como_usar }}</button>
  <button class="tablinks" onclick="openTab(event, 'FAQ')">{{ t.ajuda.faq }}</button>
  <button class="tablinks" onclick="openTab(event, 'Contato')">{{ t.ajuda.contato }}</button>
</div>

<div id="Introducao" class="tabcontent">
  <h2>{{ t.ajuda.introducao }}</h2>
  <p>{{ t.ajuda.introducao_texto }}</p>
</div>

<div id="Uso" class="tabcontent">
  <h2>{{ t.ajuda.como_usar }}</h2>
  <ul>
    <li>{{ t.ajuda.como_usar_texto }}</li>
  </ul>
</div>

<div id="FAQ" class="tabcontent">
  <h2>{{ t.ajuda.faq }}</h2>
  <p>{{ t.ajuda.faq_texto }}</p>
</div>

<div id="Contato" class="tabcontent">
  <h2>{{ t.ajuda.contato }}</h2>
  <p>{{ t.ajuda.contato_texto }}</p>
</div>

<script>
    // Abre a aba inicial automaticamente
    document.getElementsByClassName("tablinks")[0].click();
</script>

</body>
</html>
