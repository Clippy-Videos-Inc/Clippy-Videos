<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>🔴 {{ live.title }} | Clippy Videos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root { color-scheme: dark; }
    html, body { height: 100%; margin: 0; background: #000; }

    .pv-stage {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .pv-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    .pv-ui {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 12px 16px;
      background: linear-gradient(to top, rgba(0,0,0,.6), rgba(0,0,0,0));
      color: #fff;
      font-family: system-ui, sans-serif;
      z-index: 10;
    }

    .pv-scrub {
      height: 6px;
      background: #333;
      border-radius: 999px;
      position: relative;
      cursor: pointer;
    }

    .pv-scrub > .fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0%;
      background: #e91e63;
      border-radius: 999px;
    }

    .pv-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-top: 8px;
    }

    .btn {
      background-color: rgba(255, 255, 255, 0.08);
      border: none;
      padding: 10px;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
    }

    .btn:hover { background-color: rgba(255, 255, 255, 0.2); }
    .btn img { width: 24px; height: 24px; object-fit: contain; }

    .pv-title {
      position: absolute;
      top: 8px;
      left: 12px;
      font-size: 18px;
      font-weight: bold;
      background: rgba(0,0,0,0.5);
      padding: 6px 12px;
      border-radius: 8px;
      color: #fff;
      opacity: .85;
      z-index: 10;
    }

    .stats {
      position: absolute;
      top: 8px;
      right: 12px;
      font-size: 14px;
      background: rgba(0,0,0,0.5);
      padding: 6px 12px;
      border-radius: 8px;
      color: #fff;
      opacity: .85;
      z-index: 10;
    }

    .aviso-fim {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 10px;
      background: rgba(0,0,0,0.85);
      color: #fff;
      font-family: system-ui, sans-serif;
      text-align: center;
      z-index: 30;
    }
    .aviso-fim.ativo { display: flex; }
    .aviso-fim a {
      color: #9d9dff;
      text-decoration: none;
      border: 1px solid #6a6aff;
      padding: 8px 18px;
      border-radius: 20px;
    }

    /* ── CHAT AO VIVO (serviço em Go) ── */
    .chat-live {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 320px;
      max-width: 85vw;
      background: rgba(10,10,20,0.75);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      font-family: system-ui, sans-serif;
      z-index: 20;
      transition: transform .25s ease;
    }
    .chat-live.fechado { transform: translateX(100%); }
    .chat-live-topo {
      padding: 12px 14px;
      font-weight: 700;
      color: #fff;
      border-bottom: 1px solid rgba(255,255,255,0.15);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .chat-live-msgs {
      flex: 1;
      overflow-y: auto;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .chat-live-msg { font-size: 13px; color: #e0e0ff; line-height: 1.4; }
    .chat-live-msg b { color: #9d9dff; }
    .chat-live-form { display: flex; gap: 6px; padding: 10px 14px; border-top: 1px solid rgba(255,255,255,0.15); }
    .chat-live-form input {
      flex: 1;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #1a1a2e;
      color: #fff;
    }
    .chat-live-form button {
      background: #6a6aff;
      border: none;
      color: #fff;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
    }
    .chat-toggle {
      position: absolute;
      top: 8px;
      right: 328px;
      z-index: 21;
      background: rgba(0,0,0,0.5);
      border: none;
      color: #fff;
      border-radius: 8px;
      padding: 8px 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="pv-stage" id="pv">
    <video class="pv-video" id="vid" autoplay playsinline></video>

    <div class="pv-title">🔴 {{ live.title }}</div>
    <div class="stats" id="statusBadge">🟡 conectando…</div>

    <div class="aviso-fim" id="avisoFim">
      <div style="font-size:20px; font-weight:700;">A transmissão foi encerrada</div>
      <a href="/aovivo">Ver outras lives</a>
    </div>

    <button class="chat-toggle" id="btnToggleChat">💬</button>
    <div class="chat-live" id="chatLive">
      <div class="chat-live-topo">
        <span>Chat ao vivo</span>
        <span id="chatStatus" style="font-size:12px; color:#8888c0;">conectando…</span>
      </div>
      <div class="chat-live-msgs" id="chatMsgs"></div>
      <form class="chat-live-form" id="chatForm">
        <input type="text" id="chatInput" placeholder="Envie uma mensagem…" maxlength="300" autocomplete="off">
        <button type="submit">➤</button>
      </form>
    </div>

    <div class="pv-ui">
      <div class="pv-controls">
        <div style="display:flex; gap:8px;">
          <button class="btn" id="btnTogglePlay"><img id="playIcon" src="{{ url_for('static', filename='icons/play.png') }}"></button>
          <button class="btn" id="btnToggleMute"><img id="volumeIcon" src="{{ url_for('static', filename='icons/unmute.png') }}"></button>
        </div>
        <div style="display:flex; gap:8px;">
          <button class="btn" id="btnFullscreen"><img src="{{ url_for('static', filename='icons/fullscreen.png') }}"></button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    const vid = document.getElementById('vid');
    const playIcon = document.getElementById('playIcon');
    const volumeIcon = document.getElementById('volumeIcon');
    const btnTogglePlay = document.getElementById('btnTogglePlay');
    const btnToggleMute = document.getElementById('btnToggleMute');
    const btnFullscreen = document.getElementById('btnFullscreen');
    const statusBadge = document.getElementById('statusBadge');
    const avisoFim = document.getElementById('avisoFim');
    const liveId = "{{ live.id }}";

    let pc;
    let publisherSid = null;
    // io() sem forçar transports: negocia automaticamente (long-polling
    // funciona atrás do Waitress; WebSocket é usado quando disponível).
    const socket = io();

    function criarConexao() {
      pc = new RTCPeerConnection();
      pc.ontrack = (e) => { vid.srcObject = e.streams[0]; };
      pc.onicecandidate = (e) => {
        if (e.candidate && publisherSid) {
          socket.emit('candidate', { liveId, candidate: e.candidate, to: publisherSid });
        }
      };
      pc.onconnectionstatechange = () => {
        if (pc.connectionState === 'connected') statusBadge.textContent = '🔴 ao vivo';
        if (['failed', 'disconnected'].includes(pc.connectionState)) statusBadge.textContent = '🟡 reconectando…';
      };
    }

    function iniciarEspectador() {
      criarConexao();
      socket.emit('join', { liveId, role: 'viewer' });
    }
    iniciarEspectador();

    // O PUBLISHER que manda a oferta (ver live.html) -- o viewer só
    // responde com uma answer.
    socket.on('offer', async (payload) => {
      if (payload.liveId !== liveId) return;
      publisherSid = payload.from;
      try {
        await pc.setRemoteDescription({ type: 'offer', sdp: payload.sdp });
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        socket.emit('answer', { liveId, sdp: pc.localDescription.sdp, to: publisherSid });
      } catch (err) { console.error(err); }
    });

    socket.on('candidate', async (payload) => {
      if (payload.liveId !== liveId) return;
      try { await pc.addIceCandidate(payload.candidate); } catch {}
    });

    socket.on('publisher-left', (payload) => {
      if (payload.liveId !== liveId) return;
      avisoFim.classList.add('ativo');
      statusBadge.textContent = '⚫ encerrada';
      if (pc) pc.close();
    });

    // Controles
    btnTogglePlay.onclick = () => {
      if (vid.paused) {
        vid.play();
        playIcon.src = "{{ url_for('static', filename='icons/pause.png') }}";
      } else {
        vid.pause();
        playIcon.src = "{{ url_for('static', filename='icons/play.png') }}";
      }
    };

    btnToggleMute.onclick = () => {
      vid.muted = !vid.muted;
      volumeIcon.src = vid.muted
        ? "{{ url_for('static', filename='icons/mute.png') }}"
        : "{{ url_for('static', filename='icons/unmute.png') }}";
    };

    btnFullscreen.onclick = () => {
      const el = document.documentElement;
      if (!document.fullscreenElement) {
        el.requestFullscreen().catch(err => console.warn('Erro ao entrar em fullscreen:', err));
      } else {
        document.exitFullscreen();
      }
    };

    window.addEventListener('beforeunload', () => {
      socket.emit('leave', { liveId, role: 'viewer' });
    });

    // ── CHAT AO VIVO (serviço em Go, WebSocket próprio -- não usa o
    // Socket.IO do sinal WebRTC acima) ──────────────────────────────
    const GO_LIVECHAT_URL = {{ go_livechat_url | tojson }};
    const chatMsgs   = document.getElementById('chatMsgs');
    const chatForm   = document.getElementById('chatForm');
    const chatInput  = document.getElementById('chatInput');
    const chatStatus = document.getElementById('chatStatus');
    const chatLive   = document.getElementById('chatLive');
    const btnToggleChat = document.getElementById('btnToggleChat');

    btnToggleChat.onclick = () => chatLive.classList.toggle('fechado');

    function adicionarMensagemChat(m) {
      const div = document.createElement('div');
      div.className = 'chat-live-msg';
      div.innerHTML = `<b>${m.username}:</b> ${m.texto}`;
      chatMsgs.appendChild(div);
      chatMsgs.scrollTop = chatMsgs.scrollHeight;
    }

    let chatWs = null;
    function conectarChat(token) {
      const base = GO_LIVECHAT_URL.replace(/^http/, 'ws');
      const url = base + `ws/live/${liveId}` + (token ? `?token=${encodeURIComponent(token)}` : '');
      chatWs = new WebSocket(url);
      chatWs.onopen = () => { chatStatus.textContent = token ? 'conectado' : 'conectado (somente leitura)'; };
      chatWs.onclose = () => { chatStatus.textContent = 'desconectado'; };
      chatWs.onerror = () => { chatStatus.textContent = 'erro na conexão'; };
      chatWs.onmessage = (ev) => {
        try {
          const data = JSON.parse(ev.data);
          if (data.tipo === 'historico') {
            chatMsgs.innerHTML = '';
            (data.mensagens || []).forEach(adicionarMensagemChat);
          } else if (data.tipo === 'mensagem') {
            adicionarMensagemChat(data);
          }
        } catch (e) { console.error('mensagem de chat inválida:', e); }
      };
    }

    // Login é opcional pra ASSISTIR o chat; só é exigido pra ENVIAR
    // mensagem (o serviço Go valida isso e recusa o envio sem token).
    fetch('/api/go-token')
      .then(r => r.ok ? r.json() : null)
      .then(data => conectarChat(data && data.token))
      .catch(() => conectarChat(null));

    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const texto = chatInput.value.trim();
      if (!texto || !chatWs || chatWs.readyState !== WebSocket.OPEN) return;
      chatWs.send(JSON.stringify({ texto }));
      chatInput.value = '';
    });
  </script>
</body>
</html>
